[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "home-jarvis"
version = "0.1.0"
description = "Xiaomi S12 voice bridge with allowlisted Home Assistant actions"
requires-python = ">=3.12"
dependencies = ["python-miio==0.5.12", "requests==2.34.2"]

[project.optional-dependencies]
speaker = ["python-miio==0.5.12"]

[project.scripts]
home-jarvis = "home_jarvis.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
