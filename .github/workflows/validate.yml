name: Validate skill and runtime

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bundled runtime
        run: python -m pip install -e skills/xiaomi-speaker-jarvis/assets/runtime
      - name: Validate distributable files
        run: python scripts/validate_package.py
      - name: Run isolated runtime checks
        run: python -m unittest discover -s skills/xiaomi-speaker-jarvis/assets/runtime/tests -v
